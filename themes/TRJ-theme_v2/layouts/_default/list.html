{{ define "main" }}
    <div class="wrap">
        <div class="prose">
            <h1>{{ .Title }}</h1>
            {{ .Content }}
        </div>

        {{ with .Pages }}
            <div class="card-grid">
                {{ range .ByDate.Reverse }}
                    <a class="card" href="{{ .RelPermalink }}">
                        {{ if gt .Date.Year 1970 }}<time class="card__date">{{ .Date.Format "02.01.2006" }}</time>{{ end }}
                        <h2 class="card__title">{{ .Title }}</h2>
                        <p class="card__summary">{{ .Summary | plainify | truncate 160 }}</p>
                    </a>
                {{ end }}
            </div>
        {{ end }}
    </div>
{{ end }}
