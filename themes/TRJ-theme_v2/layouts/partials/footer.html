<footer class="site-footer">
    <div class="wrap site-footer__inner">
        <div class="site-footer__org">
            <p class="site-footer__name">Team Romagna Judo 1972</p>
            <p>Via Di Giù, 10 — 48022 Lugo (RA)</p>
            <p><a href="mailto:teamromagnajudo1972@libero.it">teamromagnajudo1972@libero.it</a></p>
        </div>
        <div class="site-footer__social">
            {{ range $k, $v := .Site.Data.social }}
                <a href="{{ $v.url }}" target="_blank" rel="noopener">{{ title $k }}</a>
            {{ end }}
        </div>
    </div>
    <div class="wrap site-footer__bottom">
        <span>© {{ now.Year }} Team Romagna Judo 1972</span>
        <span>Fotografie a cura di Lorenzo Drei</span>
    </div>
</footer>
