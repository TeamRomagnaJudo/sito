{{ $current := . }}
<header class="site-header">
    <div class="wrap site-header__inner">
        <a class="site-header__brand" href="{{ .Site.BaseURL }}">
            <img src="/images/logo.png" alt="{{ .Site.Title }}">
        </a>
        <nav class="site-nav" aria-label="Menu principale">
            <ul>
                {{ range .Site.Menus.main }}
                    {{ $active := or (eq $current.Params.menu .Identifier) (eq $current.Section .Identifier) }}
                    <li>
                        <a {{ if $active }}class="is-active"{{ end }} href="{{ .URL | relURL }}">{{ .Name }}</a>
                    </li>
                {{ end }}
            </ul>
        </nav>
    </div>
</header>
