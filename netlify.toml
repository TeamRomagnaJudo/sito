[context.production.environment]
  HUGO_VERSION = "0.101.0"

[build]
  command = "hugo"
  publish = "public"

[context.deploy-preview]
  command = "hugo --buildDrafts --buildFuture"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.101.0"

# Branch deploy "theme-v2": anteprima del nuovo tema su URL dedicato
# (es. theme-v2--<sito>.netlify.app). La produzione (master) resta su TRJ-theme_v1.
[context."theme-v2"]
  command = "hugo --theme TRJ-theme_v2 --buildFuture"

[context."theme-v2".environment]
  HUGO_VERSION = "0.101.0"